name: Build DuesDesk for macOS

on:
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab
    inputs:
      release_tag:
        description: Existing release to attach the installers to (leave blank to skip)
        default: v1.0.0
  push:
    tags: ['v*']            # also runs when you push a tag like v1.0.1

permissions:
  contents: write           # needed to upload files to a release

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          # JavaFX natives match the machine that builds, so each Mac type gets its own build.
          - runner: macos-latest        # Apple Silicon (M1 and newer)
            arch: apple-silicon
          - runner: macos-15-intel      # Intel Macs
            arch: intel
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: DuesDesK-main   # the app lives in a subfolder of the repo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: DuesDesK-main/pom.xml

      # Building on a Mac makes Maven pull the macOS JavaFX natives
      - name: Build jar
        run: mvn -B -DskipTests clean package

      - name: Stage jar
        run: |
          mkdir -p dist
          cp target/dues-manager-1.0.0.jar dist/

      - name: Package .dmg installer
        run: |
          jpackage --type dmg --name DuesDesk --app-version 1.0.0 \
            --input dist --main-jar dues-manager-1.0.0.jar \
            --main-class org.springframework.boot.loader.launch.JarLauncher \
            --runtime-image "$JAVA_HOME" \
            --icon DuesDesk.icns \
            --dest installers
          mv installers/DuesDesk-1.0.0.dmg "installers/DuesDesk-1.0.0-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: DuesDesk-mac-${{ matrix.arch }}
          path: DuesDesK-main/installers/*.dmg

      - name: Attach to release
        if: github.event.inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: gh release upload "$TAG" installers/*.dmg --clobber
