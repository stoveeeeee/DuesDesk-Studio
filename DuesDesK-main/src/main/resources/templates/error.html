<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${errorTitle} + ' | DuesDesk'">DuesDesk Error</title>
    <link href="/vendor/inter/inter.css" rel="stylesheet">
    <link href="/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="/vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
    <th:block th:replace="~{fragments :: navStyles}"></th:block>
    <script th:replace="~{fragments :: themeInit}"></script>
</head>
<body>
<main class="container py-5">
    <section class="mx-auto surface-card p-4 p-md-5" style="max-width:38rem">
        <div class="d-flex align-items-center gap-3 mb-4">
            <span class="brand-icon" aria-hidden="true"><i class="bi bi-bank2"></i></span>
            <div><div class="micro-header">DuesDesk</div><div class="small text-muted">Something needs your attention</div></div>
        </div>
        <span class="icon-tile icon-tile--danger mb-3" aria-hidden="true"><i class="bi bi-exclamation-circle"></i></span>
        <h1 class="page-title" th:text="${errorTitle}">Request could not be completed</h1>
        <p class="page-lede mb-4" th:text="${errorMessage}"></p>
        <a href="/" class="btn btn-fintech-primary"><i class="bi bi-arrow-left" aria-hidden="true"></i><span>Return to DuesDesk</span></a>
    </section>
</main>
</body>
</html>
