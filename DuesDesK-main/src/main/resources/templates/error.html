<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${errorTitle} + ' | DuesDesk'">DuesDesk Error</title>
    <link href="/vendor/inter/inter.css" rel="stylesheet">
    <link href="/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="/vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
    <th:block th:replace="~{fragments :: navStyles}"></th:block>
    <script th:replace="~{fragments :: themeInit}"></script>
</head>
<body class="bg-light">
<main class="container py-5">
    <section class="mx-auto bg-white border rounded-4 shadow-sm p-4 p-md-5" style="max-width:38rem">
        <div class="text-danger fs-2 mb-3"><i class="bi bi-exclamation-circle"></i></div>
        <h1 class="h4 fw-bold" th:text="${errorTitle}">Request could not be completed</h1>
        <p class="text-secondary" th:text="${errorMessage}"></p>
        <a href="/" class="btn btn-dark">Return to DuesDesk</a>
    </section>
</main>
</body>
</html>
