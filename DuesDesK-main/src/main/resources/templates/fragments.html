<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<style th:fragment="navStyles">
    /* =====================================================================
       DuesDesk design tokens: Light + Dark. Component rules below reference
       ONLY these custom properties (no hardcoded colors in components).
       ===================================================================== */
    :root,
    html[data-theme="light"],
    body.light-mode {
        color-scheme: light;
        /* Surfaces */
        --bg-canvas: #E8ECF1;
        --bg-surface: #F6F7F9;
        --bg-elevated: #F6F7F9;
        --bg-subtle: #E0E5EC;
        --bg-hover: #EDF0F4;
        --bg-active: #D8DEE6;
        --bg-input: #FBFBFC;
        --bg-input-readonly: #E0E5EC;

        /* Borders & Focus */
        --border-subtle: #D4DAE2;
        --border-strong: #B9C2CE;
        --border-focus: #2563EB;
        --focus-ring: rgba(37, 99, 235, 0.16);

        /* Typography */
        --text-primary: #0F172A;
        --text-secondary: #334155;
        --text-muted: #64748B;
        --text-placeholder: #94A3B8;

        /* Buttons */
        --btn-primary-bg: #2563EB;
        --btn-primary-hover: #1D4ED8;
        --btn-primary-text: #FFFFFF;
        --btn-secondary-bg: #F6F7F9;
        --btn-secondary-hover: #ECEFF3;
        --btn-secondary-text: #334155;
        --btn-secondary-border: #B9C2CE;
        --btn-ghost-bg: #EDF0F4;
        --btn-ghost-hover: #E1E6ED;

        /* Semantic Status Pills */
        --status-success-bg: #D5ECDD;
        --status-success-text: #15803D;
        --status-success-border: #86EFAC;
        --status-warning-bg: #F3E8C6;
        --status-warning-text: #B45309;
        --status-warning-border: #FDE68A;
        --status-danger-bg: #F4DADA;
        --status-danger-text: #B91C1C;
        --status-danger-border: #FECACA;
        --status-neutral-bg: #E0E5EC;
        --status-neutral-text: #475569;
        --status-neutral-border: #D4DAE2;

        /* Reward Glows & Spring Physics */
        --glow-primary: 0 0 14px rgba(37, 99, 235, 0.28);
        --glow-success: 0 0 14px rgba(22, 163, 74, 0.25);
        --shadow-card: 0 1px 2px rgba(15, 23, 42, 0.06);
        --shadow-btn: 0 1px 2px rgba(15, 23, 42, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        --spring-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
        --ease-snappy: cubic-bezier(0.16, 1, 0.3, 1);

        /* Extended roles (same system) */
        --status-info-bg: #E1EAF6;
        --status-info-text: #1D4ED8;
        --status-info-border: #BFDBFE;
        --bg-selected: rgba(37, 99, 235, 0.06);
        --highlight-flash: rgba(37, 99, 235, 0.18);
        --shadow-hover: 0 4px 12px rgba(15, 23, 42, 0.06);
        --shadow-pop: 0 8px 22px rgba(15, 23, 42, 0.08);
        --shadow-modal: 0 20px 50px rgba(15, 23, 42, 0.15);
        --progress-track: #D9E0E9;
        --progress-track-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.08);
        --progress-primary: linear-gradient(90deg, #60A5FA 0%, #2563EB 100%);
        --progress-success: linear-gradient(90deg, #4ADE80 0%, #16A34A 100%);
        --progress-warning: linear-gradient(90deg, #FCD34D 0%, #D97706 100%);
        --progress-glow-primary: 0 0 10px rgba(37, 99, 235, 0.35);
        --progress-glow-success: 0 0 10px rgba(22, 163, 74, 0.32);
        --progress-glow-warning: 0 0 10px rgba(217, 119, 6, 0.3);
        --progress-danger: linear-gradient(90deg, #FCA5A5 0%, #DC2626 100%);
        --progress-glow-danger: 0 0 10px rgba(220, 38, 38, 0.32);
        /* Stat history chart (Numbers page) */
        --chart-primary: #2563EB;
        --chart-area-top: rgba(37, 99, 235, 0.22);
        --chart-area-bottom: rgba(37, 99, 235, 0);
        --chart-baseline: #94A3B8;
        /* Solid destructive button (white text stays readable in both themes) */
        --btn-danger-bg: #DC2626;
        --btn-danger-hover: #B91C1C;
        --control-h: 36px;
        --control-h-sm: 30px;
        --radius-control: 8px;
        --radius-card: 12px;
    }

    html[data-theme="dark"],
    html[data-bs-theme="dark"],
    html.dark,
    body[data-theme="dark"],
    body.dark-mode,
    body.dark {
        color-scheme: dark;
        /* Surfaces */
        --bg-canvas: #0B0F19;
        --bg-surface: #111827;
        --bg-elevated: #1E293B;
        --bg-subtle: #1E293B;
        --bg-hover: #1E293B;
        --bg-active: #334155;
        --bg-input: #0F172A;
        --bg-input-readonly: #1E293B;

        /* Borders & Focus */
        --border-subtle: #1E293B;
        --border-strong: #334155;
        --border-focus: #3B82F6;
        --focus-ring: rgba(59, 130, 246, 0.25);

        /* Typography */
        --text-primary: #F8FAFC;
        --text-secondary: #CBD5E1;
        --text-muted: #94A3B8;
        --text-placeholder: #64748B;

        /* Buttons */
        --btn-primary-bg: #3B82F6;
        --btn-primary-hover: #2563EB;
        --btn-primary-text: #FFFFFF;
        --btn-secondary-bg: #1E293B;
        --btn-secondary-hover: #334155;
        --btn-secondary-text: #F1F5F9;
        --btn-secondary-border: #334155;
        --btn-ghost-bg: rgba(255, 255, 255, 0.03);
        --btn-ghost-hover: #334155;

        /* Semantic Status Pills (Dark-Safe Luminous Badges) */
        --status-success-bg: rgba(34, 197, 94, 0.14);
        --status-success-text: #4ADE80;
        --status-success-border: rgba(74, 222, 128, 0.35);
        --status-warning-bg: rgba(245, 158, 11, 0.14);
        --status-warning-text: #FBBF24;
        --status-warning-border: rgba(251, 191, 36, 0.32);
        --status-danger-bg: rgba(239, 68, 68, 0.14);
        --status-danger-text: #F87171;
        --status-danger-border: rgba(248, 113, 113, 0.32);
        --status-neutral-bg: rgba(148, 163, 184, 0.12);
        --status-neutral-text: #CBD5E1;
        --status-neutral-border: rgba(148, 163, 184, 0.24);

        /* Reward Glows & Spring Physics */
        --glow-primary: 0 0 18px rgba(59, 130, 246, 0.42);
        --glow-success: 0 0 16px rgba(74, 222, 128, 0.32);
        --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.35);
        --shadow-btn: 0 1px 2px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.12);

        /* Extended roles */
        --status-info-bg: rgba(59, 130, 246, 0.14);
        --status-info-text: #60A5FA;
        --status-info-border: rgba(96, 165, 250, 0.35);
        --bg-selected: rgba(59, 130, 246, 0.14);
        --highlight-flash: rgba(96, 165, 250, 0.28);
        --shadow-hover: 0 6px 16px rgba(0, 0, 0, 0.45);
        --shadow-pop: 0 10px 28px rgba(0, 0, 0, 0.55);
        --shadow-modal: 0 24px 60px rgba(0, 0, 0, 0.6);
        --progress-track: #1A2335;
        --progress-track-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.45);
        --progress-primary: linear-gradient(90deg, #93C5FD 0%, #3B82F6 100%);
        --progress-success: linear-gradient(90deg, #86EFAC 0%, #22C55E 100%);
        --progress-warning: linear-gradient(90deg, #FDE68A 0%, #F59E0B 100%);
        --progress-glow-primary: 0 0 12px rgba(59, 130, 246, 0.55);
        --progress-glow-success: 0 0 12px rgba(74, 222, 128, 0.45);
        --progress-glow-warning: 0 0 12px rgba(251, 191, 36, 0.4);
        --progress-danger: linear-gradient(90deg, #FECACA 0%, #EF4444 100%);
        --progress-glow-danger: 0 0 12px rgba(248, 113, 113, 0.45);
        --chart-primary: #60A5FA;
        --chart-area-top: rgba(96, 165, 250, 0.28);
        --chart-area-bottom: rgba(96, 165, 250, 0);
        --chart-baseline: #475569;
        --btn-danger-bg: #DC2626;
        --btn-danger-hover: #EF4444;
    }

    /* Legacy variable names used by individual pages, mapped onto the tokens */
    :root {
        --canvas: var(--bg-canvas);
        --surface: var(--bg-surface);
        --fill-subtle: var(--bg-subtle);
        --border: var(--border-subtle);
        --row-hairline: var(--border-subtle);
        --text-faint: var(--text-placeholder);
        --navy: var(--text-primary);
        --ink: var(--text-primary);
        --muted: var(--text-muted);
        --line: var(--border-subtle);
        --blue: var(--btn-primary-bg);
        --blue-hover: var(--btn-primary-hover);
        --positive-text: var(--status-success-text); --positive-bg: var(--status-success-bg); --positive-border: var(--status-success-border); --positive-dot: var(--status-success-text);
        --warning-text: var(--status-warning-text); --warning-bg: var(--status-warning-bg); --warning-border: var(--status-warning-border); --warning-dot: var(--status-warning-text);
        --negative-text: var(--status-danger-text); --negative-bg: var(--status-danger-bg); --negative-border: var(--status-danger-border); --negative-dot: var(--status-danger-text);
        --neutral-text: var(--status-neutral-text); --neutral-bg: var(--status-neutral-bg); --neutral-border: var(--status-neutral-border); --neutral-dot: var(--text-placeholder);
        --slate-50: var(--bg-canvas); --slate-100: var(--bg-subtle); --slate-200: var(--border-subtle); --slate-300: var(--border-strong);
        --slate-400: var(--text-placeholder); --slate-500: var(--text-muted); --slate-600: var(--text-secondary); --slate-700: var(--text-secondary);
        --slate-800: var(--text-secondary); --slate-900: var(--text-primary);
        --primary-600: var(--btn-primary-bg); --primary-700: var(--btn-primary-hover);
        --emerald-50: var(--status-success-bg); --emerald-600: var(--status-success-text); --emerald-700: var(--status-success-text);
        --rose-50: var(--status-danger-bg); --rose-600: var(--status-danger-text); --rose-700: var(--status-danger-text);
        --amber-50: var(--status-warning-bg); --amber-600: var(--status-warning-text); --amber-700: var(--status-warning-text);
        --polish-shadow: var(--shadow-card);
        --polish-ring: 0 0 0 3px var(--focus-ring);

        /* Bootstrap 5.3 variables follow the tokens so stock components theme correctly */
        --bs-body-bg: var(--bg-canvas);
        --bs-body-color: var(--text-secondary);
        --bs-emphasis-color: var(--text-primary);
        --bs-secondary-color: var(--text-muted);
        --bs-tertiary-color: var(--text-muted);
        --bs-secondary-bg: var(--bg-subtle);
        --bs-tertiary-bg: var(--bg-subtle);
        --bs-border-color: var(--border-subtle);
        --bs-link-color: var(--btn-primary-bg);
        --bs-link-hover-color: var(--btn-primary-hover);
        --bs-heading-color: var(--text-primary);
    }

    @keyframes duesdesk-page-enter { from { opacity: .92; } to { opacity: 1; } }
    @keyframes subtleSlideIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes rewardToastIn {
        0% { opacity: 0; transform: translateY(-10px) scale(.96); }
        60% { opacity: 1; transform: translateY(2px) scale(1.01); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes rewardCheckPop {
        0% { opacity: 0; transform: scale(0) rotate(-25deg); }
        55% { opacity: 1; transform: scale(1.35) rotate(6deg); }
        100% { opacity: 1; transform: scale(1) rotate(0); }
    }
    @keyframes rewardGlowPulse { 0% { opacity: 0; } 25% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes rewardSpark {
        0% { opacity: 1; transform: translate(0, 0) scale(1); }
        100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.2); }
    }
    @keyframes rewardTick { 0% { transform: scale(.8); } 60% { transform: scale(1.14); } 100% { transform: scale(1); } }
    @keyframes navIndicatorIn { from { transform: scaleX(.2); opacity: 0; } to { transform: scaleX(1); opacity: 1; } }
    /* Only a "from" frame: each bar grows from empty to its own inline width. */
    @keyframes progressGrow { from { width: 0; } }
    @keyframes progressShine { from { transform: translateX(-100%); } to { transform: translateX(250%); } }

    * { box-sizing: border-box; }
    html, body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg-canvas); color: var(--text-secondary);
        font-size: 13px; line-height: 1.45;
    }
    /* Text can only be highlighted where it can be edited: form fields and editable areas. */
    body { -webkit-user-select: none; user-select: none; }
    input, textarea, [contenteditable="true"], [contenteditable=""] { -webkit-user-select: text; user-select: text; }
    input[type="checkbox"], input[type="radio"], input[type="range"], input[type="color"], input[type="button"], input[type="submit"] { -webkit-user-select: none; user-select: none; }

    /* In the desktop app the page header doubles as the window's title bar (drag area plus the minimize, maximize and
       close buttons), so anything laid over the whole window starts below it. The app sets --desktop-header-h. */
    .modal { padding-top: var(--desktop-header-h, 0px); }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }

    h1,h2,h3,h4,h5,h6 { color: var(--text-primary); letter-spacing: -0.015em; }
    .view-title { font-size: 18px; font-weight: 600; letter-spacing: -0.015em; color: var(--text-primary); }
    .card-title, .section-title { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; color: var(--text-primary); }
    .card-sub { font-size: 12px; color: var(--text-placeholder); }
    .form-label { font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 4px; }
    .table thead th { font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-muted); }
    .tabular-nums, .table td, .kpi-value, .metric-value { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }

    /* Bootstrap utilities that hardcode light/dark colors, made token-driven */
    .text-dark { color: var(--text-primary) !important; }
    .text-secondary, .text-muted { color: var(--text-muted) !important; }
    .text-primary { color: var(--btn-primary-bg) !important; }
    .text-success { color: var(--status-success-text) !important; }
    .text-danger { color: var(--status-danger-text) !important; }
    .text-warning { color: var(--status-warning-text) !important; }
    .text-info { color: var(--status-info-text) !important; }
    .bg-white { background-color: var(--bg-surface) !important; }
    .bg-light, .text-bg-light { background-color: var(--bg-subtle) !important; color: var(--text-secondary) !important; }
    .border, .border-top, .border-bottom, .border-start, .border-end { border-color: var(--border-subtle) !important; }
    code { color: var(--text-primary); background: var(--bg-subtle); border-radius: 4px; padding: 1px 5px; }
    hr { border-color: var(--border-subtle); opacity: 1; }

    body > main { animation: duesdesk-page-enter .12s ease-out; }
    .app-header-stack { position: sticky; top: 0; z-index: 1030; background: var(--bg-surface); border-bottom: 1px solid var(--border-subtle); }
    .app-header-stack .app-navbar { margin-bottom: 0 !important; }
    .app-header-stack .section-nav { margin-top: 0; margin-bottom: 0; border-bottom: 0; }
    .app-header-stack + main { padding-top: 1.5rem; }
    .app-navbar, .banner { background: var(--bg-surface); border-bottom: 1px solid var(--border-subtle); padding-top: .9rem; padding-bottom: .9rem; }
    .brand-icon { width: 36px; height: 36px; background: var(--btn-primary-bg); color: var(--btn-primary-text); border-radius: var(--radius-control); display: inline-flex; align-items: center; justify-content: center; font-size: 1.1rem; box-shadow: var(--shadow-btn); }

    /* ---- Section navigation ---- */
    .section-nav { position: relative; z-index: 1; background: var(--bg-surface); border-bottom: 1px solid var(--border-subtle); overflow: visible; }
    .section-nav > .container-xxl { display: flex; gap: 0.25rem; align-items: center; padding-top: .25rem; padding-bottom: .25rem; flex-wrap: wrap; justify-content: center; }
    .section-nav a { color: var(--text-muted); text-decoration: none; font-size: 13px; font-weight: 500; padding: .5rem .75rem; border-radius: 6px; transition: background .08s ease, color .08s ease; position: relative; }
    .section-nav a:hover { background: var(--bg-hover); color: var(--text-primary); }
    .section-nav a[aria-current="page"] { color: var(--btn-primary-bg); }
    /* Active-tab bar. Dropdown toggles keep ::after for their chevron, so their bar uses ::before. */
    .section-nav a[aria-current="page"]:not(.dropdown-toggle)::after,
    .section-nav a.dropdown-toggle[aria-current="page"]::before { content: ''; position: absolute; display: block; left: .75rem; right: .75rem; bottom: -0.25rem; height: 2px; margin: 0; border: 0; background: var(--btn-primary-bg); border-radius: 1px; pointer-events: none; animation: navIndicatorIn .3s var(--spring-bounce) both; }
    .section-nav .dropdown-toggle { cursor: pointer; }
    .section-nav .dropdown { position: relative; padding-bottom: .25rem; margin-bottom: -.25rem; }
    /* ---- Dropdown menus: one surface, one motion ----
       Bootstrap-toggled menus (appearance, stat picker) animate in on .show. The hover menus
       (section nav, table actions) stay mounted and transition between hidden and open.
       Motion uses the individual translate/scale properties so it never fights the inline
       transform Popper writes to position a menu. */
    @keyframes dropdownIn { from { opacity: 0; translate: 0 -6px; scale: .97; } to { opacity: 1; translate: 0 0; scale: 1; } }
    @keyframes dropdownInUp { from { opacity: 0; translate: 0 6px; scale: .97; } to { opacity: 1; translate: 0 0; scale: 1; } }
    @keyframes dropdownItemIn { from { opacity: 0; translate: -4px 0; } to { opacity: 1; translate: 0 0; } }

    .dropdown-menu {
        --bs-dropdown-bg: var(--bg-elevated);
        --bs-dropdown-color: var(--text-secondary);
        --bs-dropdown-border-color: var(--border-subtle);
        --bs-dropdown-link-color: var(--text-secondary);
        --bs-dropdown-link-hover-bg: var(--bg-hover);
        --bs-dropdown-link-hover-color: var(--text-primary);
        --bs-dropdown-link-active-bg: var(--status-info-bg);
        --bs-dropdown-link-active-color: var(--status-info-text);
        --bs-dropdown-link-disabled-color: var(--text-placeholder);
        --bs-dropdown-header-color: var(--text-muted);
        --bs-dropdown-divider-bg: var(--border-subtle);
        --bs-dropdown-min-width: 10rem;
        --bs-dropdown-padding-x: .3rem;
        --bs-dropdown-padding-y: .3rem;
        --bs-dropdown-item-padding-x: .65rem;
        --bs-dropdown-item-padding-y: .42rem;
        --bs-dropdown-font-size: 13px;
        border: 1px solid var(--border-subtle); border-radius: 10px; box-shadow: var(--shadow-pop);
        font-size: 13px; transform-origin: top left;
    }
    .dropdown-menu-end { transform-origin: top right; }
    .dropdown-menu[data-popper-placement="top-start"] { transform-origin: bottom left; }
    .dropdown-menu[data-popper-placement="top-end"] { transform-origin: bottom right; }
    .dropdown-menu.show { animation: dropdownIn .2s var(--ease-snappy) both; }
    .dropdown-menu.show[data-popper-placement^="top"] { animation-name: dropdownInUp; }

    .dropdown-item {
        display: flex; align-items: center; gap: .55rem; border-radius: 6px; font-weight: 500;
        transition: background-color .1s ease, color .1s ease, box-shadow .12s ease;
    }
    .dropdown-item > .bi:first-child { color: var(--text-placeholder); transition: color .1s ease; }
    .dropdown-item:hover > .bi:first-child, .dropdown-item:focus > .bi:first-child, .dropdown-item.active > .bi:first-child { color: currentColor; }
    .dropdown-item:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--focus-ring); }
    .dropdown-item.text-danger:hover, .dropdown-item.text-danger:focus { background: var(--status-danger-bg); }
    .dropdown-item:disabled, .dropdown-item.disabled { opacity: .6; cursor: not-allowed; }
    .dropdown-divider { margin: .3rem .2rem; }
    .dropdown-header { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; padding: .4rem .65rem .2rem; }

    /* Items cascade in just behind the panel. */
    .dropdown-menu.show > *,
    .section-nav .dropdown.is-open > .dropdown-menu > *,
    .table-actions-menu:hover > .dropdown-menu > *,
    .table-actions-menu:focus-within > .dropdown-menu > * {
        animation: dropdownItemIn .22s var(--ease-snappy) both; animation-delay: calc(var(--item-i, 0) * 22ms + 30ms);
    }
    .dropdown-menu > :nth-child(2) { --item-i: 1; }
    .dropdown-menu > :nth-child(3) { --item-i: 2; }
    .dropdown-menu > :nth-child(4) { --item-i: 3; }
    .dropdown-menu > :nth-child(5) { --item-i: 4; }
    .dropdown-menu > :nth-child(n+6) { --item-i: 5; }

    /* Chevron caret that flips while its menu is open. */
    .dropdown-toggle::after {
        width: .4em; height: .4em; margin-left: .45em; vertical-align: .22em;
        border: 0; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
        transform: rotate(45deg); opacity: .6;
        transition: rotate .26s var(--spring-bounce), opacity .12s ease;
    }
    .dropdown-toggle.show::after,
    .section-nav .dropdown.is-open > .dropdown-toggle::after { rotate: 180deg; opacity: 1; }

    .section-nav .dropdown-menu,
    .table-actions-menu > .dropdown-menu {
        display: block; visibility: hidden; opacity: 0; pointer-events: none; translate: 0 -6px; scale: .97;
        transition: opacity .12s ease, translate .16s var(--ease-snappy), scale .16s var(--ease-snappy), visibility .16s;
    }
    .section-nav .dropdown.is-open > .dropdown-menu,
    .table-actions-menu:hover > .dropdown-menu,
    .table-actions-menu:focus-within > .dropdown-menu,
    .table-actions-menu.show > .dropdown-menu {
        visibility: visible; opacity: 1; pointer-events: auto; translate: 0 0; scale: 1;
        transition-duration: .16s, .24s, .24s, 0s;
    }
    .section-nav .dropdown-menu { margin-top: .25rem; }
    .section-nav .dropdown-item { padding: var(--bs-dropdown-item-padding-y) var(--bs-dropdown-item-padding-x); font-size: 13px; color: var(--bs-dropdown-link-color); }
    .section-nav .dropdown-item:hover, .section-nav .dropdown-item:focus { background: var(--bs-dropdown-link-hover-bg); color: var(--bs-dropdown-link-hover-color); }

    .dropdown-item .check { margin-left: auto; padding-left: .5rem; opacity: 0; transform: scale(.4); transition: opacity .12s ease, transform .22s var(--spring-bounce); }
    .dropdown-item.active .check, .dropdown-item[aria-selected="true"] .check { opacity: 1; transform: scale(1); }
    .theme-toggle > .btn { background: var(--btn-ghost-bg); color: var(--text-secondary); border: 1px solid var(--border-subtle); }
    .theme-toggle > .btn:hover { background: var(--btn-ghost-hover); color: var(--text-primary); }

    .table-actions-menu { position: relative; display: inline-block; }

    /* Themed select menus (see the select enhancer in themeScript). The native <select> stays in

    @keyframes dropdownOut { to { opacity: 0; scale: .98; } }

        content: ''; position: absolute; right: 12px; top: 50%; width: .4em; height: .4em; margin-top: -.3em;
        border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;

    .form-select.dd-select-trigger.is-invalid { border-color: var(--status-danger-text); box-shadow: 0 0 0 3px var(--status-danger-bg); }
    .form-select.dd-select-trigger:disabled { cursor: not-allowed; }
    .form-select.dd-select-native {
        position: absolute !important; width: 1px !important; height: 1px !important; min-height: 0 !important;
        padding: 0 !important; margin: 0 !important; border: 0 !important; opacity: 0; pointer-events: none;
    }
    .dropdown-menu.dd-select-menu { position: fixed; z-index: 1090; margin: 0; max-height: 280px; overflow-y: auto; overscroll-behavior: contain; }
    .dd-select-menu .dropdown-item { white-space: normal; cursor: pointer; }
    .dd-select-menu .dropdown-item.is-active { background: var(--bs-dropdown-link-hover-bg); color: var(--bs-dropdown-link-hover-color); }
    .dd-select-menu .dropdown-item[aria-selected="true"] { color: var(--status-info-text); font-weight: 600; }
    .dd-select-menu .dropdown-item.disabled { cursor: not-allowed; }

    .table-actions-menu > .dropdown-toggle::after { display: none; }

    /* Date fields (see the date picker in themeScript): a typeable box plus a pop-up month calendar. The real

    .dp-field { position: relative; display: block; }

        position: absolute; top: 50%; right: .3rem; translate: 0 -50%; width: 1.65rem; height: 1.65rem; padding: 0;
        display: grid; place-items: center; border: 0; border-radius: 6px; background: transparent; color: var(--text-muted);
        cursor: pointer; transition: background-color .12s ease, color .12s ease;

    input.dp-native {
        position: absolute !important; left: 0; bottom: 0; width: 1px !important; height: 1px !important; min-height: 0 !important;
        padding: 0 !important; margin: 0 !important; border: 0 !important; opacity: 0; pointer-events: none;
    }

    .dp-popup {
        position: fixed; z-index: 1090; width: 17.25rem; padding: .65rem; background: var(--bg-elevated); color: var(--text-secondary);
        border: 1px solid var(--border-subtle); border-radius: 12px; box-shadow: var(--shadow-pop); font-size: 13px;
        animation: dropdownIn .18s var(--ease-snappy) both;
    }

    .dp-head { display: flex; align-items: center; justify-content: space-between; gap: .25rem; margin-bottom: .35rem; }
    .dp-title { font-weight: 600; font-size: 13.5px; color: var(--text-primary); }
    .dp-nav {
        width: 1.9rem; height: 1.9rem; padding: 0; display: grid; place-items: center; border: 0; border-radius: 8px;
        background: transparent; color: var(--text-secondary); transition: background-color .1s ease, color .1s ease;

    .dp-day {
        height: 2.1rem; padding: 0; border: 0; border-radius: 8px; background: transparent; color: var(--text-primary);
        font-size: 12.5px; font-variant-numeric: tabular-nums; cursor: pointer;
        transition: background-color .1s ease, color .1s ease, scale .12s var(--spring-bounce);
    }

    .dp-day:active { scale: .92; }
    .dp-day.is-outside { color: var(--text-placeholder); }
    .dp-day.is-today { box-shadow: inset 0 0 0 1.5px var(--btn-primary-bg); color: var(--btn-primary-bg); font-weight: 600; }
    .dp-day.is-selected { background: var(--btn-primary-bg); color: var(--btn-primary-text); font-weight: 600; box-shadow: none; }
    .dp-day:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--focus-ring); }
    .dp-day.is-selected:focus-visible { box-shadow: 0 0 0 2px var(--bg-elevated), 0 0 0 4px var(--btn-primary-bg); }

    .dp-foot { display: flex; justify-content: space-between; align-items: center; margin-top: .45rem; padding-top: .45rem; border-top: 1px solid var(--border-subtle); }
    .dp-link { border: 0; background: transparent; color: var(--btn-primary-bg); font-weight: 600; font-size: 12.5px; padding: .25rem .45rem; border-radius: 6px; }
    .dp-link:hover { background: var(--bg-hover); }

    .dp-link:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--focus-ring); }

    @media (prefers-reduced-motion: reduce) { .dp-popup { animation: none; } }

    /* ---- Hover preview + expanding panel (calendar days, chair budgets) ----
       A preview unfolds out of the side of its trigger on hover; clicking it morphs into a near full-screen
       panel. Behaviour lives in window.duesDeskPeek (themeScript). */
    .hover-peek {
        position: fixed; z-index: 1060; top: 0; left: 0; width: 300px; max-width: calc(100vw - 24px);
        background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: 12px; box-shadow: var(--shadow-pop);
        padding: .8rem .85rem .7rem; cursor: pointer; text-align: left; color: var(--text-secondary);
        opacity: 0; visibility: hidden; pointer-events: none; transform: scale(.94);
        /* The window "extends" out of its trigger: a clip reveal sweeping away from it, plus a small grow. */
        clip-path: inset(0 100% 0 0); -webkit-clip-path: inset(0 100% 0 0); transform-origin: left top;
        transition: opacity .14s ease, transform .3s var(--ease-snappy), clip-path .34s var(--ease-snappy), -webkit-clip-path .34s var(--ease-snappy), visibility 0s linear .34s;
    }
    .hover-peek[data-side="left"] { transform-origin: right top; clip-path: inset(0 0 0 100%); -webkit-clip-path: inset(0 0 0 100%); }
    .hover-peek[data-side="below"] { transform-origin: center top; clip-path: inset(0 0 100% 0); -webkit-clip-path: inset(0 0 100% 0); }
    .hover-peek[data-side="above"] { transform-origin: center bottom; clip-path: inset(100% 0 0 0); -webkit-clip-path: inset(100% 0 0 0); }
    .hover-peek.is-open {
        opacity: 1; visibility: visible; pointer-events: auto; transform: none;
        clip-path: inset(-40px); -webkit-clip-path: inset(-40px);
        transition: opacity .16s ease, transform .32s var(--ease-snappy), clip-path .38s var(--ease-snappy), -webkit-clip-path .38s var(--ease-snappy), visibility 0s;
    }
    /* Sliding between neighbouring triggers while open. */
    .hover-peek.is-open.is-moving { transition: opacity .16s ease, top .24s var(--ease-snappy), left .24s var(--ease-snappy), visibility 0s; }
    .hover-peek:hover { border-color: var(--border-strong); }
    .hover-peek:focus-visible { outline: none; box-shadow: var(--shadow-pop), 0 0 0 3px var(--focus-ring); }
    .peek-head { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; margin-bottom: .5rem; }
    .peek-title { font-weight: 600; color: var(--text-primary); font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .peek-count { font-size: 11.5px; color: var(--text-muted); white-space: nowrap; }
    .peek-totals { display: flex; gap: .35rem; flex-wrap: wrap; margin-bottom: .55rem; }
    .peek-list { list-style: none; margin: 0; padding: 0; }
    .peek-list li { display: flex; justify-content: space-between; gap: .6rem; padding: .3rem 0; border-top: 1px solid var(--border-subtle); font-size: 12.5px; animation: peekRowIn .26s var(--ease-snappy) both; }
    .peek-list li:nth-child(2) { animation-delay: .03s; } .peek-list li:nth-child(3) { animation-delay: .06s; } .peek-list li:nth-child(4) { animation-delay: .09s; }
    .peek-list .who { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-primary); }
    .peek-more, .peek-note { font-size: 11.5px; color: var(--text-muted); padding-top: .35rem; }
    .peek-foot { display: flex; align-items: center; gap: .35rem; margin-top: .55rem; padding-top: .5rem; border-top: 1px solid var(--border-subtle); font-size: 11.5px; font-weight: 500; color: var(--status-info-text); }
    .flow-chip { display: inline-flex; align-items: center; gap: .25rem; border-radius: 999px; padding: .12rem .5rem; font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; border: 1px solid transparent; }
    .flow-chip.in { background: var(--status-success-bg); color: var(--status-success-text); border-color: var(--status-success-border); }
    .flow-chip.out { background: var(--status-danger-bg); color: var(--status-danger-text); border-color: var(--status-danger-border); }
    .flow-chip.net { background: var(--status-neutral-bg); color: var(--status-neutral-text); border-color: var(--status-neutral-border); }
    .flow-chip.info { background: var(--status-info-bg); color: var(--status-info-text); border-color: var(--status-info-border); }
    .amt { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
    .amt.in { color: var(--status-success-text); } .amt.out { color: var(--status-danger-text); }
    @keyframes peekRowIn { from { opacity: 0; translate: -6px 0; } to { opacity: 1; translate: 0 0; } }

    body.expand-active { overflow: hidden; }
    .expand-backdrop { position: fixed; inset: 0; z-index: 1070; background: rgba(2, 6, 23, .45); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); opacity: 0; transition: opacity .28s ease; }
    .expand-backdrop.is-open { opacity: 1; }
    .expand-panel {
        position: fixed; z-index: 1071; display: flex; flex-direction: column; overflow: hidden;
        background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 16px; box-shadow: var(--shadow-modal);
        transition: top .42s var(--ease-snappy), left .42s var(--ease-snappy), width .42s var(--ease-snappy), height .42s var(--ease-snappy), border-radius .42s var(--ease-snappy), opacity .2s ease;
    }
    .expand-panel.no-anim { transition: none; }
    .expand-inner { display: flex; flex-direction: column; min-height: 0; height: 100%; opacity: 0; transition: opacity .18s ease; }
    .expand-panel.is-open .expand-inner { opacity: 1; transition: opacity .24s ease .16s; }
    .expand-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; padding: 1.1rem 1.25rem; border-bottom: 1px solid var(--border-subtle); }
    .expand-title { font-size: 18px; font-weight: 600; color: var(--text-primary); margin: 0; }
    .expand-sub { font-size: 12.5px; color: var(--text-muted); margin-top: .15rem; }
    .expand-close { display: inline-flex; align-items: center; gap: .45rem; flex-shrink: 0; }
    .expand-close kbd { font: inherit; font-size: 11px; padding: .05rem .35rem; border-radius: 4px; border: 1px solid var(--border-strong); color: var(--text-muted); background: var(--bg-subtle); }
    .expand-body { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 1.1rem 1.25rem; }
    .expand-totals { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .expand-totals .flow-chip { font-size: 13px; padding: .25rem .7rem; }
    .expand-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; align-items: start; }
    .expand-col { border: 1px solid var(--border-subtle); border-radius: 12px; overflow: hidden; }
    .expand-col > h3 { display: flex; justify-content: space-between; align-items: center; margin: 0; padding: .65rem .9rem; font-size: 13px; font-weight: 600; color: var(--text-primary); background: var(--bg-subtle); border-bottom: 1px solid var(--border-subtle); }
    .expand-list { list-style: none; margin: 0; padding: 0; }
    .expand-list li { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; padding: .65rem .9rem; border-bottom: 1px solid var(--border-subtle); animation: peekRowIn .3s var(--ease-snappy) both; }
    .expand-list li:last-child { border-bottom: 0; }
    .expand-list .who { font-weight: 500; color: var(--text-primary); }
    .expand-list .what { font-size: 12px; color: var(--text-muted); }
    .expand-empty { padding: 1.25rem .9rem; color: var(--text-muted); font-size: 12.5px; text-align: center; }
    .expand-note { display: flex; align-items: center; justify-content: space-between; gap: .75rem; flex-wrap: wrap; padding: .6rem .8rem; margin-bottom: 1rem; border: 1px solid var(--status-info-border); border-radius: 10px; background: var(--status-info-bg); color: var(--status-info-text); font-size: 12.5px; }
    .expand-footer { display: flex; justify-content: space-between; align-items: center; gap: .75rem; flex-wrap: wrap; padding: .85rem 1.25rem; border-top: 1px solid var(--border-subtle); background: var(--bg-subtle); }
    @media (max-width: 575px) { .expand-close .label, .expand-close kbd { display: none; } .expand-cols { grid-template-columns: 1fr; } }
    @media (hover: none) { .hover-peek { display: none; } }

    /* ---- Shared page layout: every page uses the same header, card header strip, labels and empty states ----
       Top tier: .page-header then KPIs / alerts. Middle tier: the main card with its toolbar in .card-head.
       Bottom tier: .tier-heading introduces secondary tools (collapsible cards, settings, bulk actions). */
    .page-header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 1rem; margin-bottom: 1.5rem; }
    .page-eyebrow { color: var(--btn-primary-bg); font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: .45rem; }
    .page-title { font-size: 1.65rem; font-weight: 700; color: var(--text-primary); letter-spacing: -.02em; line-height: 1.2; margin: 0 0 .3rem; }
    .page-lede { color: var(--text-muted); font-size: .9rem; margin: 0; max-width: 62rem; }
    .page-actions { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; }
    /* Titles take the free width and shrink first, so actions and switches stay on the right instead of wrapping below. */
    .page-header > div:first-child { flex: 1 1 26rem; min-width: 0; }
    .card-head > div:first-child:not(:only-child) { flex: 1 1 16rem; min-width: 0; }
    .tier-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin: 2rem 0 .85rem; }
    .tier-heading h2 { font-size: .78rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--text-muted); margin: 0; }
    .tier-heading p { font-size: .8rem; color: var(--text-muted); margin: 0; }
    .card-head { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border-subtle); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: .75rem; }
    .card-body-pad { padding: 1rem 1.25rem; }
    .drawer-panel { background: var(--bg-canvas); border-bottom: 1px solid var(--border-subtle); }
    @media (min-width: 768px) { .card-head { padding: 1.15rem 1.5rem; } .card-body-pad { padding: 1.25rem 1.5rem; } }
    .card-head .section-title, .card-head h3.section-title { margin: 0; }
    /* A badge or icon tile stays beside its title; the text takes the remaining width instead of wrapping below. */
    .card-head > .step-badge + div, .card-head > .icon-tile + div { flex: 1 1 12rem; min-width: 0; }
    .section-subtitle { font-size: .8rem; color: var(--text-muted); margin: 0; }
    .form-label-fintech { display: inline-block; font-size: .78rem; font-weight: 600; color: var(--text-secondary); margin-bottom: .35rem; }
    .kpi-sub { font-size: .8rem; color: var(--text-muted); margin-top: .4rem; }
    .empty-note { padding: 2rem 1rem; text-align: center; color: var(--text-muted); font-size: .86rem; }
    .empty-note .bi { display: block; font-size: 1.6rem; margin-bottom: .4rem; opacity: .7; }
    .step-badge { display: inline-grid; place-items: center; width: 1.6rem; height: 1.6rem; flex: 0 0 1.6rem; border-radius: 50%; background: var(--status-info-bg); color: var(--status-info-text); font-size: .78rem; font-weight: 700; }
    .icon-tile--danger { background: var(--status-danger-bg) !important; color: var(--status-danger-text) !important; }
    .icon-tile { display: inline-grid; place-items: center; width: 2.25rem; height: 2.25rem; flex: 0 0 2.25rem; border-radius: 10px; background: var(--status-info-bg); color: var(--status-info-text); font-size: 1.05rem; }

    /* ---- Cards ---- */
    .surface-card, .metric-card, .panel, .surface {
        background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-card);
        box-shadow: var(--shadow-card); color: var(--text-secondary);
    }
    .surface-card { transition: border-color .12s ease, box-shadow .12s ease; }
    .surface-card:focus-within { border-color: var(--border-strong); box-shadow: var(--shadow-hover); }
    .metric-card { transition: transform .22s var(--spring-bounce), box-shadow .18s var(--ease-snappy), border-color .12s ease; }
    .metric-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-hover); }
    .metric-description, .muted { color: var(--text-muted); }

    .kpi-card { padding: 1.1rem 1.25rem; transition: border-color .12s ease, box-shadow .18s var(--ease-snappy), transform .22s var(--spring-bounce); }
    .kpi-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-hover); transform: translateY(-1px); }
    /* ---- Expandable cards: preview on hover, pin open by clicking the header or working inside ---- */
    .hover-expand-card { scroll-margin-top: 7rem; }
    .hover-expand-card__header { padding: 1rem; transition: padding-bottom .28s var(--ease-snappy); }
    .hover-expand-card__toggle {
        display: flex; align-items: center; justify-content: space-between; gap: .75rem; width: 100%;
        border: 0; padding: 0; background: transparent; color: var(--text-primary); font: inherit; text-align: left; cursor: pointer;
    }
    .hover-expand-card__toggle:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 4px; border-radius: 4px; }
    .hover-expand-card__icon { flex-shrink: 0; color: var(--text-muted); font-size: .85rem; transition: transform .28s var(--ease-snappy); }
    .hover-expand-card__content {
        display: grid; grid-template-rows: 0fr; opacity: 0; visibility: hidden;
        transition: grid-template-rows .28s var(--ease-snappy), opacity .16s ease, visibility 0s linear .28s;
    }
    .hover-expand-card__inner { min-height: 0; overflow: hidden; }
    .hover-expand-card__body { padding: 0 1rem 1rem; }
    .hover-expand-card.is-expanded .hover-expand-card__header { padding-bottom: 0; }
    .hover-expand-card.is-expanded .hover-expand-card__content {
        grid-template-rows: 1fr; opacity: 1; visibility: visible;
        transition: grid-template-rows .32s var(--ease-snappy), opacity .2s ease .05s, visibility 0s;
    }
    .hover-expand-card.is-expanded .hover-expand-card__icon { transform: rotate(180deg); }
    @media (min-width: 768px) {
        .hover-expand-card__header { padding: 1.5rem; }
        .hover-expand-card__body { padding: 0 1.5rem 1.5rem; }
    }
    @media (prefers-reduced-motion: reduce) { .hover-expand-card__content { transition-delay: 0s !important; } }

    .kpi-label { font-size: 12.5px; letter-spacing: 0; font-weight: 500; line-height: 1.3; color: var(--text-muted); text-transform: none; margin-bottom: .45rem; display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
    .kpi-value { font-size: 1.55rem; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; color: var(--text-primary); }

    /* ---- Buttons: one geometry, one set of states ---- */
    .btn {

<script th:fragment="themeInit" th:inline="javascript">

                input.dataset.numberMin = input.getAttribute('min') || '';

                input.dataset.numberStep = input.getAttribute('step') || '1';
                input.type = 'text';

                input.autocomplete = 'off';

        // Keyboard shortcuts. "/" or Ctrl/Cmd+K: focus the page's search box. Ctrl/Cmd+Enter: submit the form being

        // Reminder quick actions on the Dues and Rent ledgers:

        var isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);

        document.addEventListener('click', function (event) {

                    .catch(function () { window.alert('The reminder could not be copied.'); });

        // Table tools for full-screen tables. The table is read as it is displayed right now: columns marked

        function cellText(cell) {

                .map(function (line) { return line.replace(/\s+/g, ' ').trim(); })

        function readTable(table, title) {

        // [data-export-table="#tableId"] downloads that table as a PDF. The desktop window can't download files, so

                saveBlob(blob, 'DuesDesk-' + slug + '-' + new Date().toISOString().slice(0, 10) + '.pdf');
            }).catch(function (error) {
                window.alert(error.message || 'The table could not be exported.');
            }).finally(function () {
                button.disabled = false;
                if (label) label.textContent = button.dataset.exportLabel;
            });
        });

        // Reward micro-interactions: spark burst on confirmation toasts, press feedback on submits.
        // All decorative nodes are pointer-events:none (see .reward-sparks) so they never block clicks.
        (function () {
            var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (reduced) return;
            document.querySelectorAll('.alert-success[data-auto-dismiss]').forEach(function (toast) {
                var layer = document.createElement('span');
                layer.className = 'reward-sparks';
                layer.setAttribute('aria-hidden', 'true');
                for (var i = 0; i < 10; i++) {
                    var angle = (Math.PI * 2 * i) / 10 + Math.random() * 0.4;
                    var dist = 22 + Math.random() * 26;
                    var spark = document.createElement('span');
                    spark.className = 'reward-spark';
                    spark.style.setProperty('--dx', Math.round(Math.cos(angle) * dist) + 'px');
                    spark.style.setProperty('--dy', Math.round(Math.sin(angle) * dist) + 'px');
                    spark.style.animationDelay = (160 + i * 14) + 'ms';
                    layer.appendChild(spark);
                }
                toast.appendChild(layer);
                setTimeout(function () { if (layer.parentNode) layer.parentNode.removeChild(layer); }, 1500);
            });
            document.addEventListener('click', function (event) {
                var btn = event.target.closest('button[type="submit"].btn-fintech-primary, button[type="submit"].btn-primary, button[type="submit"].btn-dark');
                if (!btn || btn.disabled) return;
                btn.style.transition = 'box-shadow .12s ease';
                btn.style.boxShadow = 'var(--shadow-btn), var(--glow-primary)';
                setTimeout(function () { btn.style.boxShadow = ''; btn.style.transition = ''; }, 260);
            }, true);
        })();

    })();
</script>

<script th:fragment="tableFullscreenScript">
    document.addEventListener('DOMContentLoaded', function () {
        const buttons = document.querySelectorAll('[data-fullscreen-target]');
        let returnFocus = null;
        let portalPlaceholder = null;
        // The attribute holds an element id ("duesLedgerView"); a leading "#" is tolerated.
        function targetOf(button) {
            return document.getElementById((button.dataset.fullscreenTarget || '').replace(/^#/, ''));
        }
        // A target can opt into being lifted to <body> while full screen (data-fullscreen-portal="true" on the target or on
        // its button). A fixed element inside a card that moves on hover (transform) is positioned against that card, not
        // the window, so the calculator result would shrink back into the card whenever the cursor left or entered it.
        function isPortal(target) {
            return target.dataset.fullscreenPortal === 'true' || Array.prototype.some.call(buttons, function (button) {
                return button.dataset.fullscreenPortal === 'true' && targetOf(button) === target;
            });
        }
        function render(button, on) {
            const label = button.querySelector('span');
            const icon = button.querySelector('i');
            if (!button.dataset.fullscreenLabel && label) button.dataset.fullscreenLabel = label.textContent;
            if (label) label.textContent = on ? 'Exit full screen' : button.dataset.fullscreenLabel;
            if (icon) icon.className = 'bi ' + (on ? 'bi-fullscreen-exit' : 'bi-arrows-fullscreen');
            button.setAttribute('aria-pressed', String(on));
            button.setAttribute('aria-label', on
                ? (button.dataset.fullscreenCloseLabel || 'Exit full screen table view')
                : (button.dataset.fullscreenOpenLabel || 'View table full screen'));
        }
        function setFullscreen(target, on) {
            const portal = isPortal(target);
            if (portal && on && target.parentElement !== document.body) {
                portalPlaceholder = document.createComment('calculator result position');
                target.parentElement.insertBefore(portalPlaceholder, target);
                document.body.appendChild(target);
            }
            target.classList.toggle('is-fullscreen', on);
            document.body.classList.toggle('ledger-fullscreen-active', document.querySelector('.is-fullscreen') !== null);
            buttons.forEach(function (button) {
                if (targetOf(button) === target) render(button, on);
            });
            if (portal && !on && portalPlaceholder && portalPlaceholder.parentNode) {
                portalPlaceholder.parentNode.insertBefore(target, portalPlaceholder);
                portalPlaceholder.parentNode.removeChild(portalPlaceholder);
                portalPlaceholder = null;
                if (returnFocus && document.contains(returnFocus)) returnFocus.focus();
                returnFocus = null;
            }
        }
        buttons.forEach(function (button) {
            button.addEventListener('click', function () {
                const target = targetOf(button);
                if (!target) return;
                const entering = !target.classList.contains('is-fullscreen');
                if (entering && isPortal(target)) returnFocus = button;
                setFullscreen(target, entering);
            });
        });
        document.addEventListener('keydown', function (e) {
            if (e.key !== 'Escape' || e.defaultPrevented) return;
            // Let an open menu or modal take the Escape first.
            if (document.querySelector('.dropdown-menu.show, .modal.show')) return;
            const open = document.querySelector('.is-fullscreen');
            if (open) setFullscreen(open, false);
        });
    });
</script>
