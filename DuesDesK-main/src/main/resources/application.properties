server.port=0
server.address=127.0.0.1
# Optional local overrides (Twilio credentials etc.), kept out of the repo
spring.config.import=optional:file:${user.home}/.fraternity-dues/application.properties,optional:file:${LOCALAPPDATA:${user.home}}/DuesDesk/application.properties,optional:file:${user.home}/Library/Application Support/DuesDesk/application.properties
spring.thymeleaf.cache=false
server.servlet.session.tracking-modes=cookie
server.compression.enabled=true
server.compression.mime-types=text/html,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml,text/xml
server.compression.min-response-size=1KB
server.tomcat.max-http-form-post-size=6MB
server.tomcat.max-swallow-size=6MB
# Tomcat silently drops fields past this limit, so it must cover the largest forms: batch charges send one field
# per selected member and payment plans three per installment row (up to 60).
server.tomcat.max-parameter-count=2000
server.tomcat.connection-timeout=10s
spring.mvc.async.request-timeout=15s
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true
app.rate-limit.requests-per-minute=${APP_RATE_LIMIT_PER_MINUTE:120}
sms.daily-cap=${SMS_DAILY_CAP:100}

twilio.simulation.mode=${TWILIO_SIMULATION_MODE:true}
twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.from.number=${TWILIO_FROM_NUMBER:}
# Blank = the per-OS app-data folder (~/Library/Application Support/DuesDesk, %LOCALAPPDATA%\DuesDesk), or the
# legacy ~/.fraternity-dues folder when it already holds data. Set STORE_FILE_PATH to use a specific file.
store.file.path=${STORE_FILE_PATH:}
